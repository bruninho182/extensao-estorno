<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Cancelamento</title>
  <style>
    body {
      width: 380px;
      padding: 15px;
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
    }
    h2 {
      margin-top: 0;
      font-size: 1.2em;
      color: #333;
    }
    h3 {
      margin-bottom: 5px;
      font-size: 1em;
      color: #555;
    }
    label {
      display: block;
      margin-bottom: 3px;
      font-size: 0.85em;
      color: #666;
    }
    input {
      width: 100%;
      padding: 6px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9em;
    }
    button#clearBtn {
      background: #f44336;
    }
    button#saveOperatorBtn {
      background: #2196F3;
    }
    button:hover {
      opacity: 0.9;
    }
    #status {
      margin-top: 10px;
      color: #d32f2f;
      font-size: 0.85em;
      min-height: 20px;
    }
    #collectedInfo {
      margin-top: 8px;
      font-size: 0.85em;
      background: #fff;
      border: 1px solid #ddd;
      padding: 8px;
      border-radius: 4px;
      max-height: 200px;
      overflow-y: auto;
    }
    #collectedInfo ul {
      margin: 0;
      padding-left: 18px;
    }
    .note {
      font-size: 0.75em;
      color: #888;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <h2>Automação de Cancelamento</h2>

  <h3>Operador</h3>
  <label for="operatorName">Nome do operador:</label>
  <input type="text" id="operatorName" placeholder="Digite seu nome">
  <button id="saveOperatorBtn">Salvar operador</button>

  <hr>

  <h3>Dados Coletados</h3>
  <div id="collectedInfo">Nenhum dado coletado.</div>

  <button id="copyBtn">Copiar linha para área de transferência</button>
  <button id="clearBtn">Limpar dados coletados</button>
  <div id="status"></div>

  <p class="note">
    As datas de <strong>Solicitação (B)</strong> e <strong>Estorno (P)</strong> serão preenchidas automaticamente com a data de hoje.
  </p>

  <script src="popup.js"></script>
</body>
</html>
